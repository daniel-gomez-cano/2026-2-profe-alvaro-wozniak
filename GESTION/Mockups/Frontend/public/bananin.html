<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bananín · Asistente</title>
  <script>try{var t=localStorage.getItem('bananin.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-bs-theme',t)}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="bananin">
<div class="app">
  <aside id="sidebar" class="sidebar"></aside>

  <main class="content">
    <header class="page-head">
      <h1>BANANIN</h1>
      <div class="pill-group"><span class="pill"><i class="bi bi-tree"></i> Gestión de Banano</span></div>
    </header>

    <section class="chat-wrap">
      <div id="chat-log" class="chat-log" aria-live="polite"></div>

      <div id="suggestions" class="suggestions mb-2">
        <button type="button">¿Lo transporto o lo vendo aquí?</button>
        <button type="button">¿Cuándo debo venderlo?</button>
        <button type="button">¿Cuánto tiempo le queda?</button>
      </div>

      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" class="chat-input" type="text" placeholder="Escribe tu mensaje…" aria-label="Mensaje" required>
        <button id="chat-send" class="chat-send" type="submit">Enviar</button>
      </form>
    </section>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
