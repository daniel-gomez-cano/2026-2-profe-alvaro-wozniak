<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historial · Bananín</title>
  <script>try{var t=localStorage.getItem('bananin.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-bs-theme',t)}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="historial">
<div class="app">
  <aside id="sidebar" class="sidebar"></aside>

  <main class="content">
    <header class="page-head">
      <h1>Historial</h1>
      <div class="pill-group"><span class="pill"><i class="bi bi-tree"></i> Gestión de Banano</span></div>
    </header>

    <section class="row g-4">
      <div class="col-lg-6">
        <div id="hist-list" class="hist-list" aria-live="polite">
          <div class="skeleton mb-2" style="height:28px;width:55%"></div>
          <div class="skeleton mb-2" style="height:22px"></div>
          <div class="skeleton mb-2" style="height:22px"></div>
          <div class="skeleton mb-2" style="height:22px"></div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card-bn">
          <div class="card-label">Color en el tiempo</div>
          <div class="chart-box tall"><canvas id="chart" role="img" aria-label="Color en el tiempo"></canvas></div>
        </div>
        <div class="text-center mt-4">
          <button id="btn-informe" class="btn-banana"><i class="bi bi-download"></i> Descargar Informe</button>
          <div id="informe-msg" class="kpi-sub mt-2"></div>
        </div>
      </div>
    </section>

    <div id="error" class="alert alert-warning mt-3 d-none"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/charts.js"></script>
<script src="js/historial.js"></script>
</body>
</html>
